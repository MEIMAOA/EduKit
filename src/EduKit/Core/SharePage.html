<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电教委工具箱 · 局域网快传</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:#f3f5f8;color:#1b1b1b}
.header{background:linear-gradient(135deg,#0f6cbd,#3aa0e8);color:#fff;padding:28px 20px 24px}
.header h1{margin:0;font-size:22px;font-weight:600}
.header p{margin:8px 0 0;font-size:13px;opacity:.92}
.container{max-width:820px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.drop{border:2px dashed #b9c6d4;border-radius:12px;padding:34px 16px;text-align:center;color:#5d6b7a;cursor:pointer;transition:.2s}
.drop.over{border-color:#0f6cbd;background:#eef6ff;color:#0f6cbd}
.drop b{display:block;font-size:16px;color:#0f6cbd;margin-bottom:6px}
.files{list-style:none;padding:0;margin:0}
.files li{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid #eef0f3;gap:10px}
.files li:last-child{border-bottom:none}
.fname{font-size:14px;word-break:break-all}
.fmeta{font-size:12px;color:#8a94a0;margin-top:3px}
.fbtns{display:flex;gap:8px;flex-shrink:0}
.btn{display:inline-block;padding:8px 14px;border-radius:8px;font-size:13px;text-decoration:none;border:none;cursor:pointer}
.btn.primary{background:#0f6cbd;color:#fff}
.btn.ghost{background:#eef1f5;color:#33404d}
.empty{color:#8a94a0;font-size:13px;text-align:center;padding:22px 0}
#tip{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(20,20,20,.86);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;display:none}
.progress{height:5px;background:#e6ebf1;border-radius:3px;overflow:hidden;margin-top:10px;display:none}
.progress i{display:block;height:100%;width:0;background:#0f6cbd;transition:width .15s}
</style>
</head>
<body>
<div class="header">
  <h1>电教委工具箱 · 局域网快传</h1>
  <p>手机和这台电脑连同一个 Wi-Fi / 局域网，即可互相传文件。</p>
</div>
<div class="container">
  <div class="card">
    <div class="drop" id="drop">
      <b>点击选择文件，或把文件拖到这里</b>
      <span>支持一次选择多个文件</span>
      <div class="progress" id="bar"><i></i></div>
    </div>
    <input type="file" id="picker" multiple style="display:none">
  </div>
  <div class="card">
    <ul class="files" id="files"><li class="empty">正在加载…</li></ul>
  </div>
</div>
<div id="tip"></div>
<script>
var picker = document.getElementById('picker');
var drop = document.getElementById('drop');
var bar = document.getElementById('bar');
var tip = document.getElementById('tip');

function showTip(t){
  tip.textContent = t;
  tip.style.display = 'block';
  clearTimeout(window._tipTimer);
  window._tipTimer = setTimeout(function(){ tip.style.display = 'none'; }, 2600);
}

function esc(s){
  return s.replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function load(){
  fetch('/api/list').then(function(r){ return r.json(); }).then(function(files){
    var box = document.getElementById('files');
    if(!files.length){
      box.innerHTML = '<li class="empty">还没有文件，上传一个试试吧</li>';
      return;
    }
    box.innerHTML = files.map(function(f){
      var url = '/download?name=' + encodeURIComponent(f.name);
      return '<li><div><div class="fname">' + esc(f.name) + '</div>' +
        '<div class="fmeta">' + f.sizeText + ' · ' + f.time + '</div></div>' +
        '<div class="fbtns"><a class="btn primary" href="' + url + '">下载</a>' +
        '<button class="btn ghost" data-name="' + esc(f.name) + '" onclick="del(this.getAttribute(\'data-name\'))">删除</button></div></li>';
    }).join('');
  }).catch(function(){ showTip('无法读取文件列表'); });
}

function del(name){
  if(!confirm('确定删除 ' + name + ' 吗？')) return;
  fetch('/delete?name=' + encodeURIComponent(name), { method: 'POST' }).then(load);
}

function uploadOne(file){
  return new Promise(function(resolve){
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload?name=' + encodeURIComponent(file.name));
    xhr.upload.onprogress = function(e){
      if(e.lengthComputable){
        bar.style.display = 'block';
        bar.firstElementChild.style.width = (e.loaded / e.total * 100) + '%';
      }
    };
    xhr.onload = function(){
      bar.style.display = 'none';
      bar.firstElementChild.style.width = '0';
      var ok = false;
      try { ok = JSON.parse(xhr.responseText).ok; } catch(err) {}
      showTip(ok ? ('已上传 ' + file.name) : ('上传失败：' + file.name));
      resolve();
    };
    xhr.onerror = function(){
      bar.style.display = 'none';
      showTip('网络错误，上传失败');
      resolve();
    };
    xhr.send(file);
  });
}

function uploadFiles(list){
  var files = Array.prototype.slice.call(list);
  files.reduce(function(p, f){
    return p.then(function(){ return uploadOne(f); });
  }, Promise.resolve()).then(load);
}

drop.onclick = function(){ picker.click(); };
picker.onchange = function(){ uploadFiles(picker.files); picker.value = ''; };
['dragenter', 'dragover'].forEach(function(t){
  drop.addEventListener(t, function(e){ e.preventDefault(); drop.classList.add('over'); });
});
['dragleave', 'drop'].forEach(function(t){
  drop.addEventListener(t, function(e){ e.preventDefault(); drop.classList.remove('over'); });
});
drop.addEventListener('drop', function(e){
  if(e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
});
load();
</script>
</body>
</html>

name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build EduKit.sln -c Release --nologo

      - name: Smoke test (--selftest)
        shell: pwsh
        run: |
          $exe = "src/EduKit/bin/Release/EduKit.exe"
          $report = Join-Path $PWD "selftest.txt"
          $process = Start-Process -FilePath $exe -ArgumentList @("--selftest", $report) -PassThru -Wait
          if (Test-Path $report) {
            Get-Content $report -Encoding UTF8
          } else {
            throw "selftest report was not generated"
          }
          if ($process.ExitCode -ne 0) {
            throw "selftest failed with exit code $($process.ExitCode)"
          }

      - name: Package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File ./build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduKit-win
          path: dist/EduKit-v1.4.0.zip
